<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Capstone Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Portfolio</h1>
        <nav>
            <a href="#about">About Me</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section id="about">
            <h2 style="margin-left:450px;">About Me</h2>
            <img src="ApexPlanet.png" alt="A photo of me" class="profile-pic" loading="lazy">
            <p>Welcome to my capstone project. I am a web developer focused in HTML, CSS, and JavaScript. This portfolio demonstrates my ability to build and optimize a full web application from scratch.</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="web">Web App</button>
                <button class="filter-btn" data-filter="mobile">Mobile</button>
            </div>
            <div id="project-gallery" class="project-gallery">
                </div>
        </section>

        <section id="contact" class="card">
            <h2>Get In Touch</h2>
            <form id="contact-form" onsubmit="return validateForm()">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" rows="5"></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
<header>
    <footer>
        <p>&copy; 2025 My Portfolio</p>
    </footer>
</header>
    <script src="script.js"></script>
</body>
</html>
